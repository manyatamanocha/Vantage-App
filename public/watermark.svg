<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960">
  <defs>
    <radialGradient id="fade" cx="50%" cy="50%" r="54%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1" />
      <stop offset="72%" stop-color="#fff" stop-opacity="1" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="fadeMask">
      <rect width="960" height="960" fill="url(#fade)" />
    </mask>
  </defs>

  <!-- Convergence Rings — concentric rings pulsing outward from a solid
       center point, with a few lines locking onto it from different
       directions: many possible readings converging on one right answer. -->
  <g mask="url(#fadeMask)" fill="none" stroke="#2F6FF5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <circle cx="480" cy="480" r="58" stroke-width="6" opacity="0.9" />
    <circle cx="480" cy="480" r="144" stroke-width="4.5" stroke-dasharray="4 20" opacity="0.6" />
    <circle cx="480" cy="480" r="240" stroke-width="3.5" stroke-dasharray="2 26" opacity="0.45" />
    <circle cx="480" cy="480" r="352" stroke-width="2.5" opacity="0.22" />

    <line x1="480" y1="480" x2="480" y2="150" stroke-width="3.5" opacity="0.55" />
    <line x1="480" y1="480" x2="740" y2="650" stroke-width="3.5" opacity="0.55" />
    <line x1="480" y1="480" x2="240" y2="290" stroke-width="3.5" opacity="0.55" />

    <circle cx="480" cy="150" r="12" fill="#2F6FF5" stroke="none" opacity="0.85" />
    <circle cx="740" cy="650" r="12" fill="#2F6FF5" stroke="none" opacity="0.85" />
    <circle cx="240" cy="290" r="12" fill="#2F6FF5" stroke="none" opacity="0.85" />

    <circle cx="480" cy="480" r="16" fill="#2F6FF5" stroke="none" />
    <path d="M480 96 A384 384 0 0 1 560 102" stroke-width="9" opacity="0.95" />

    <!-- faint scattered dot grid, matching the outgoing constellation's texture -->
    <g fill="#2F6FF5" stroke="none" opacity="0.28">
      <circle cx="150" cy="330" r="3" /><circle cx="170" cy="330" r="3" /><circle cx="190" cy="330" r="3" />
      <circle cx="150" cy="350" r="3" /><circle cx="170" cy="350" r="3" /><circle cx="190" cy="350" r="3" />
      <circle cx="150" cy="370" r="3" /><circle cx="170" cy="370" r="3" /><circle cx="190" cy="370" r="3" />
      <circle cx="770" cy="600" r="3" /><circle cx="790" cy="600" r="3" /><circle cx="810" cy="600" r="3" />
      <circle cx="770" cy="620" r="3" /><circle cx="790" cy="620" r="3" /><circle cx="810" cy="620" r="3" />
    </g>
  </g>
</svg>
